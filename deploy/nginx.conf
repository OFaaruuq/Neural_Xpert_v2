server {
    listen 80;
    server_name neuralxpert.com www.neuralxpert.com;
    return 301 https://neuralxpert.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name neuralxpert.com www.neuralxpert.com;
    server_tokens off;

    # ssl_certificate /etc/letsencrypt/live/neuralxpert.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/neuralxpert.com/privkey.pem;

    client_max_body_size 6m;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /static/uploads/ {
        alias /var/www/neuralxpert/app/static/uploads/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /static/ {
        alias /var/www/neuralxpert/app/static/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
