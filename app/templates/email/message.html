<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#F5F5F5;color:#06050B;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F5F5;margin:0;padding:0;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border:1px solid #E0E0E0;border-radius:18px;overflow:hidden;">
                    <tr>
                        <td style="background:#06050B;padding:22px 28px;">
                            <p style="margin:0;font-family:Georgia, 'Times New Roman', serif;font-size:22px;line-height:1.2;color:#ffffff;font-weight:700;">Neural Xpert</p>
                            <p style="margin:6px 0 0;font-family:Arial, Helvetica, sans-serif;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#D4FF12;">Enterprise AI</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:28px;font-family:Arial, Helvetica, sans-serif;font-size:16px;line-height:1.55;color:#484848;">
                            <h1 style="margin:0 0 16px;font-family:Georgia, 'Times New Roman', serif;font-size:26px;line-height:1.25;color:#06050B;font-weight:700;">{{ title }}</h1>
                            {{ inner }}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:18px 28px 24px;border-top:1px solid #E0E0E0;font-family:Arial, Helvetica, sans-serif;font-size:13px;line-height:1.5;color:#8B8B8B;">
                            Neural Xpert<br>
                            <a href="{{ site_url }}" style="color:#7B5DFF;text-decoration:none;">{{ site_url }}</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
