{% extends "admin/base.html" %}
{% block content %}
<p class="mb-2"><a href="{{ url_for('admin.users') }}">Users</a></p>
<h1 class="h3">{{ person.email }}</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form class="card" method="post"><div class="card-body" style="max-width:640px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Name <input class="form-control" name="name" value="{{ person.name }}"></label>
    <label class="form-label mt-3">Role
        <select class="form-select" name="role_id">{% for role in roles %}<option value="{{ role.id }}" {% if person.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>{% endfor %}</select>
    </label>
    <div class="form-check mt-3">
        <input class="form-check-input" type="checkbox" name="is_active" value="1" id="active" {% if person.is_active %}checked{% endif %}>
        <label class="form-check-label" for="active">Active</label>
    </div>
    <p class="text-secondary mt-3 mb-0">{% if person.totp_enabled %}Google Authenticator is set up.{% else %}Google Authenticator is not set up yet.{% endif %}</p>
    <button class="btn btn-primary mt-3" type="submit">Save user</button>
</div></form>
{% endblock %}
