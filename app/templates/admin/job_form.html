{% extends 'admin/base.html' %}
{% block body %}
<h1 class="h3">{{ 'Edit job' if item.id else 'New job' }}</h1>
<form method="post" class="row">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for name in ['title','slug','department','location','employment_type'] %}
    <div class="col-md-6 form-group"><input class="form-control" name="{{ name }}" value="{{ item|attr(name) or '' }}" placeholder="{{ name }}"></div>
    {% endfor %}
    <div class="col-md-6 form-group"><select class="form-control" name="status"><option value="draft">Draft</option><option value="published" {% if item.status == 'published' %}selected{% endif %}>Published</option></select></div>
    <div class="col-12 form-group"><textarea class="form-control" name="description" rows="6" placeholder="Description">{{ item.description or '' }}</textarea></div>
    <div class="col-12 form-group"><textarea class="form-control" name="requirements" rows="6" placeholder="Requirements">{{ item.requirements or '' }}</textarea></div>
    <div class="col-12"><button class="th-btn" type="submit">Save</button></div>
</form>
{% endblock %}
