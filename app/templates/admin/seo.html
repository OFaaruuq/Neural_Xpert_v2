{% extends 'admin/base.html' %}
{% block body %}
<h1 class="h3">SEO</h1>
{% for record in records %}
<form method="post" class="row mb-40">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="page_key" value="{{ record.page_key }}">
    <div class="col-md-3"><strong>{{ record.page_key }}</strong></div>
    <div class="col-md-4"><input class="form-control" name="seo_title" value="{{ record.seo_title }}"></div>
    <div class="col-md-5"><input class="form-control" name="meta_description" value="{{ record.meta_description }}"></div>
    <div class="col-md-8 mt-2"><input class="form-control" name="og_image" value="{{ record.og_image }}" placeholder="Open Graph image path"></div>
    <div class="col-md-4 mt-2"><button class="th-btn" type="submit">Save</button></div>
</form>
{% endfor %}
<form method="post" class="row">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-3"><input class="form-control" name="page_key" placeholder="page key" required></div>
    <div class="col-md-4"><input class="form-control" name="seo_title" placeholder="SEO title"></div>
    <div class="col-md-5"><input class="form-control" name="meta_description" placeholder="Meta description"></div>
    <div class="col-12 mt-2"><button class="th-btn" type="submit">Add page SEO</button></div>
</form>
{% endblock %}
