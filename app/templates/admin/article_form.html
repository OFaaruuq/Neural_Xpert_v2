{% extends 'admin/base.html' %}
{% block body %}
<h1 class="h3">{{ 'Edit article' if item.id else 'New article' }}</h1>
<form method="post" class="row">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-8 form-group"><input class="form-control" name="title" value="{{ item.title or '' }}" placeholder="Title"></div>
    <div class="col-md-4 form-group"><input class="form-control" name="slug" value="{{ item.slug or '' }}" placeholder="Slug"></div>
    <div class="col-md-6 form-group"><input class="form-control" name="author" value="{{ item.author or 'Neural Xpert' }}" placeholder="Author"></div>
    <div class="col-md-6 form-group">
        <select class="form-control" name="category_id">
            <option value="">Category</option>
            {% for category in categories %}<option value="{{ category.id }}" {% if item.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-12 form-group"><textarea class="form-control" name="excerpt" rows="3" placeholder="Excerpt">{{ item.excerpt or '' }}</textarea></div>
    <div class="col-12 form-group"><textarea class="form-control" name="content" rows="10" placeholder="HTML content">{{ item.content or '' }}</textarea></div>
    <div class="col-md-6 form-group"><input class="form-control" name="featured_image" value="{{ item.featured_image or '' }}" placeholder="Featured image path, e.g. img/blog/example.jpg"></div>
    <div class="col-md-3 form-group"><select class="form-control" name="status"><option value="draft" {% if item.status == 'draft' %}selected{% endif %}>Draft</option><option value="published" {% if item.status == 'published' %}selected{% endif %}>Published</option></select></div>
    <div class="col-md-3 form-group"><label><input type="checkbox" name="featured" {% if item.featured %}checked{% endif %}> Featured</label></div>
    <div class="col-md-6 form-group"><input class="form-control" name="seo_title" value="{{ item.seo_title or '' }}" placeholder="SEO title"></div>
    <div class="col-md-6 form-group"><input class="form-control" name="og_image" value="{{ item.og_image or '' }}" placeholder="Open Graph image"></div>
    <div class="col-12 form-group"><textarea class="form-control" name="meta_description" rows="2" placeholder="Meta description">{{ item.meta_description or '' }}</textarea></div>
    <div class="col-12"><button class="th-btn" type="submit">Save</button></div>
</form>
{% endblock %}
