{% extends 'admin/base.html' %}
{% block body %}
<h1 class="h3">Categories</h1>
<form method="post" class="row mb-40">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-5"><input class="form-control" name="name" placeholder="Name" required></div>
    <div class="col-md-4"><select class="form-control" name="kind"><option value="article">Article</option><option value="case_study">Case study</option></select></div>
    <div class="col-md-3"><button class="th-btn" type="submit">Add</button></div>
</form>
<ul>{% for category in categories %}<li>{{ category.name }} ({{ category.kind }})</li>{% endfor %}</ul>
{% endblock %}
