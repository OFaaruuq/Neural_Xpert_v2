<img class="auth-logo" src="{{ brand.admin }}" alt="Neural Xpert">
<p class="auth-kicker">Staff access</p>
<ol class="auth-steps" aria-label="Sign-in progress">
    <li class="{% if step > 1 %}is-done{% elif step == 1 %}is-current{% endif %}"><span>1</span>Password</li>
    <li class="{% if step > 2 %}is-done{% elif step == 2 %}is-current{% endif %}"><span>2</span>Email code</li>
    <li class="{% if step > 3 %}is-done{% elif step == 3 %}is-current{% endif %}"><span>3</span>Authenticator</li>
</ol>
